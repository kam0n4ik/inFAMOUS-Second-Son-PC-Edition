; SecondSonPC native runtime configuration.
; Game files are not part of this program: point DataDir at your own legally obtained copy.

[Game]
DataDir = E:\shdps4\CUSA00004
CharacterPackage = art\cache\hero.xpps
; Converted meshes are cached in cache\character.spcmesh (rebuilt when the package changes).
UseConvertedCache = true
SimulationHz = 60

[Render]
Width = 1600
Height = 900
Borderless = false
VSync = true
Validation = false
CullBackFaces = true

[Character]
; The game's model space is normalised (the hero spans z -1..1); scale to metres.
ModelScale = 0.9
; Parts to hide (package offsets, hex). c0700 = bunny-ears mask accessory of hero.xpps.
; Variant selection of the original game is not reconstructed yet; [ and ] select a part, H toggles it.
HideParts = c0700
; Shared packages searched for colour maps the character package does not contain.
TexturePackages = art\cache\hero.flavor(default).xpps, art\cache\core_common.sprig.xpps

[World]
; Optional chunk of the original environment (empty = test ground with crates).
ChunkPackage =
TexturePackages = art\cache\core_common.sprig.xpps
WalkSpeed = 2.4
RunSpeed = 6.0
JumpSpeed = 7.2
Gravity = 22

[Input]
; One or two keys per action, comma separated: letters, digits, F1..F12, Space, LShift, Escape...
MoveForward = W, Up
MoveBack = S, Down
MoveLeft = A, Left
MoveRight = D, Right
Jump = Space
Sprint = LShift
ToggleMouseCapture = F2
ToggleFreeCamera = F3
MouseSensitivity = 0.0025
GamepadLookSpeed = 900
StickDeadZone = 0.24
InvertY = false
CaptureMouse = true

[Log]
Level = info
