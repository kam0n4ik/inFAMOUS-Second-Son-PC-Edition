; SecondSonPC native runtime configuration.
; Game files are not part of this program: point DataDir at your own legally obtained copy.

[Game]
DataDir = E:\shdps4\CUSA00004
CharacterPackage = art\cache\hero.xpps
; Converted meshes are cached in cache\character.spcmesh (rebuilt when the package changes).
UseConvertedCache = true
SimulationHz = 60

[Render]
Width = 1600
Height = 900
Borderless = false
VSync = true
Validation = false
CullBackFaces = true

[Character]
; Meshes and skeleton are decoded in metres (game centimetres / 100): Delsin is 1.83 m tall.
ModelScale = 1.0
; Parts to hide (package offsets, hex). c0700 = bunny-ears mask accessory of hero.xpps.
; Variant selection of the original game is not reconstructed yet; [ and ] select a part, H toggles it.
HideParts = c0700
; Shared packages searched for colour maps the character package does not contain.
TexturePackages = art\cache\hero.flavor(default).xpps, art\cache\core_common.sprig.xpps

[World]
; Chunks of the original environment, comma separated (they share one world frame; empty = test
; ground with crates). a1 = forest and rocks of the village, a5/a2 = neighbouring houses and docks.
ChunkPackage = art\cache\a1.xpps, art\cache\a5.xpps, art\cache\a2.xpps
; Shared packages: geometry exported to the chunk through KNLX links, and colour maps by id.
TexturePackages = art\cache\core_village.sprig.xpps, art\cache\core_common.sprig.xpps
WalkSpeed = 2.4
RunSpeed = 6.0
JumpSpeed = 7.2
Gravity = 22

[Animation]
; Original clips of Delsin's 413-joint rig ('70AE' blobs, 2034 of them in core_common). The game
; stores no clip names: each role below was identified by motion analysis of the decoded clip
; (foot plants, knee angles, loop closure; docs/native/N11_FIRST_PLAYABLE_REPORT.md). Values are
; data offsets (hex) inside ClipPackage.
ClipPackage = art\cache\core_common.sprig.xpps
Idle = 1aed3a0
Walk = 26762a0
Run = 2777220
JumpStart = 3395ef0
Fall = 26f08f0
Land = 316afe0
; Ground speed at playback rate 1, measured from the stance foot of the walk/run clip (m/s).
WalkSpeed = 0.86
RunSpeed = 4.9
BlendSeconds = 0.2

[Input]
; One or two keys per action, comma separated: letters, digits, F1..F12, Space, LShift, Escape...
MoveForward = W, Up
MoveBack = S, Down
MoveLeft = A, Left
MoveRight = D, Right
Jump = Space
Sprint = LShift
ToggleMouseCapture = F2
ToggleFreeCamera = F3
MouseSensitivity = 0.0025
GamepadLookSpeed = 900
StickDeadZone = 0.24
InvertY = false
CaptureMouse = true

[Log]
Level = info
